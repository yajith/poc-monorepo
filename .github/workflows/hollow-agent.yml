name: "hollow-agent"

on:
  pull_request:
    paths:
      - "src/hollow-agent/**"
      - "src/agent/**"
      - "src/shared-pkg/**"
      - "src/shared-api/**"
      - ".github/workflows/hollow-agent.yml"
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# hollow-agent has lint + build only — no unit-tests, integration-tests, or system-tests.

jobs:
  run-linters:
    name: "run-linters"
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: "Simulate linting"
        run: |
          if [ -f "test/fail-hollow-agent-run-linters" ]; then
            echo "Failure injection: hollow-agent/run-linters"; exit 1
          fi
          sleep 6
          echo "hollow-agent run-linters complete"
      - name: "Report result"
        if: always()
        uses: ./.github/actions/report-ci-callback
        with:
          component: "hollow-agent"
          category: "portainer/lint"
          subjob: "run-linters"
          status: ${{ job.status == 'success' && 'success' || 'failure' }}
          worker-url: ${{ vars.WORKER_URL }}
          sha: ${{ github.event.pull_request.head.sha }}

  build-manifests:
    name: "build-manifests"
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: "Simulate build"
        run: |
          if [ -f "test/fail-hollow-agent-build-manifests" ]; then
            echo "Failure injection: hollow-agent/build-manifests"; exit 1
          fi
          sleep 8
          echo "hollow-agent build-manifests complete"
      - name: "Report result"
        if: always()
        uses: ./.github/actions/report-ci-callback
        with:
          component: "hollow-agent"
          category: "portainer/build"
          subjob: "build-manifests"
          status: ${{ job.status == 'success' && 'success' || 'failure' }}
          worker-url: ${{ vars.WORKER_URL }}
          sha: ${{ github.event.pull_request.head.sha }}
