name: "component-a"

on:
  pull_request:
    paths:
      - "src/component-a/**"
      - "src/shared/**"
      - ".github/workflows/component-a.yml"
    types: [opened, synchronize, reopened, ready_for_review]

# id-token: write is required on every job to request OIDC tokens for the callback
permissions:
  contents: read

jobs:
  run-linters:
    name: "run-linters"
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: "Simulate linting"
        run: |
          echo "Linting component-a..."
          # Uncomment to simulate a failure:
          # exit 1

      - name: "Report result"
        if: always()
        uses: ./.github/actions/report-ci-callback
        with:
          component: "component-a"
          category: "portainer/lint"
          subjob: "run-linters"
          status: ${{ job.status == 'success' && 'success' || 'failure' }}
          worker-url: ${{ vars.WORKER_URL }}
          sha: ${{ github.event.pull_request.head.sha }}

  run-tests:
    name: "run-tests"
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: "Simulate unit tests"
        run: |
          echo "Running unit tests for component-a..."
          # Uncomment to simulate a failure:
          # exit 1

      - name: "Report result"
        if: always()
        uses: ./.github/actions/report-ci-callback
        with:
          component: "component-a"
          category: "portainer/unit-tests"
          subjob: "run-tests"
          status: ${{ job.status == 'success' && 'success' || 'failure' }}
          worker-url: ${{ vars.WORKER_URL }}
          sha: ${{ github.event.pull_request.head.sha }}

  build-manifests:
    name: "build-manifests"
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: "Simulate build"
        run: |
          echo "Building component-a..."
          # Uncomment to simulate a failure:
          # exit 1

      - name: "Report result"
        if: always()
        uses: ./.github/actions/report-ci-callback
        with:
          component: "component-a"
          category: "portainer/build"
          subjob: "build-manifests"
          status: ${{ job.status == 'success' && 'success' || 'failure' }}
          worker-url: ${{ vars.WORKER_URL }}
          sha: ${{ github.event.pull_request.head.sha }}
