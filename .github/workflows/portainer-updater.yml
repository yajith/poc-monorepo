name: "updater"

on:
  pull_request:
    paths:
      - "src/updater/**"
      - ".github/workflows/portainer-updater.yml"
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  run-linters:
    name: "run-linters"
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: "Simulate linting"
        run: |
          if [ -f "test/fail-updater-run-linters" ]; then
            echo "Failure injection: updater/run-linters"; exit 1
          fi
          sleep 5
          echo "updater run-linters complete"
      - name: "Report result"
        if: always()
        uses: ./.github/actions/report-ci-callback
        with:
          component: "updater"
          category: "portainer/lint"
          subjob: "run-linters"
          status: ${{ job.status == 'success' && 'success' || 'failure' }}
          worker-url: ${{ vars.WORKER_URL }}
          sha: ${{ github.event.pull_request.head.sha }}

  run-tests:
    name: "run-tests"
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: "Simulate unit tests"
        run: |
          if [ -f "test/fail-updater-run-tests" ]; then
            echo "Failure injection: updater/run-tests"; exit 1
          fi
          sleep 10
          echo "updater run-tests complete"
      - name: "Report result"
        if: always()
        uses: ./.github/actions/report-ci-callback
        with:
          component: "updater"
          category: "portainer/unit-tests"
          subjob: "run-tests"
          status: ${{ job.status == 'success' && 'success' || 'failure' }}
          worker-url: ${{ vars.WORKER_URL }}
          sha: ${{ github.event.pull_request.head.sha }}

  build-manifests:
    name: "build-manifests"
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: "Simulate build"
        run: |
          if [ -f "test/fail-updater-build-manifests" ]; then
            echo "Failure injection: updater/build-manifests"; exit 1
          fi
          sleep 6
          echo "updater build-manifests complete"
      - name: "Report result"
        if: always()
        uses: ./.github/actions/report-ci-callback
        with:
          component: "updater"
          category: "portainer/build"
          subjob: "build-manifests"
          status: ${{ job.status == 'success' && 'success' || 'failure' }}
          worker-url: ${{ vars.WORKER_URL }}
          sha: ${{ github.event.pull_request.head.sha }}
